# =====================================================================
# ĐỀ 11 - HỆ THỐNG ĐẶT VÉ XEM PHIM / SỰ KIỆN
# Giai đoạn 2: + Giám sát Prometheus, Grafana, cAdvisor, node-exporter, mysqld-exporter, nginx-exporter
# Chạy toàn bộ:   docker compose up -d --build
# Kiểm tra:       docker compose ps
# =====================================================================
name: cinema

services:
  # ==================== CƠ SỞ DỮ LIỆU ====================
  db:
    image: mysql:8.4
    container_name: cinema-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --log-error-verbosity=3   # ghi cả cảnh báo "Access denied" vào log
      - --local-infile=OFF
      - --skip-name-resolve
      - --max-connections=150
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost  # root chỉ đăng nhập được từ bên trong container
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      # Các biến dưới đây được script db/init/03-users.sh dùng để tạo tài khoản giới hạn quyền
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      DBA_DB_USER: ${DBA_DB_USER}
      DBA_DB_PASSWORD: ${DBA_DB_PASSWORD}
      REPORT_DB_USER: ${REPORT_DB_USER}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      EXPORTER_DB_USER: ${EXPORTER_DB_USER}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql                          # dữ liệu (named volume)
      - ./db/init:/docker-entrypoint-initdb.d:ro       # script tạo bảng, dữ liệu mẫu, user
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - app-network

  # ==================== WEBSITE ĐẶT VÉ (PHP 8.3 + Apache) ====================
  app:
    build:
      context: ./app
    image: cinema-app:1.0
    container_name: cinema-app
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      APP_SEED_DEMO: ${APP_SEED_DEMO:-true}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ==================== CÔNG CỤ QUẢN LÝ CSDL ====================
  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: cinema-phpmyadmin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ABSOLUTE_URI: https://pma.cinema.local/
      HIDE_PHP_VERSION: "true"
      UPLOAD_LIMIT: 20M
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # ==================== NGINX REVERSE PROXY (HTTPS) ====================
  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    container_name: cinema-nginx
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "80:8080"                 # HTTP (tự chuyển sang HTTPS)
      - "443:8443"                # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/auth:/etc/nginx/auth:ro
    depends_on:
      - app
      - phpmyadmin
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - app-network
      - monitoring                # để nginx-exporter đọc trang stub_status

  # ==================== GIÁM SÁT: PROMETHEUS + GRAFANA ====================
  prometheus:
    image: prom/prometheus:v3.13.4
    container_name: cinema-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.external-url=https://prometheus.cinema.local/
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - app-network               # đọc /metrics của app
      - monitoring

  grafana:
    image: grafana/grafana:13.2.4
    container_name: cinema-grafana
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.cinema.local/
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_LOG_MODE: console
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/cinema-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro   # tự thêm datasource + dashboard
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  # cAdvisor: metrics của từng container
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: cinema-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  # node-exporter: metrics của máy chủ Ubuntu
  node-exporter:
    image: prom/node-exporter:v1.10.2
    container_name: cinema-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker/.+)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring

  # mysqld-exporter: metrics của MySQL (tài khoản chỉ có quyền PROCESS, REPLICATION CLIENT)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.18.0
    container_name: cinema-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=${EXPORTER_DB_USER}
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network               # nối tới MySQL
      - monitoring                # để Prometheus đọc metrics

  # nginx-exporter: đọc trang stub_status nội bộ của Nginx (cổng 8081)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: cinema-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - monitoring

networks:
  app-network:
    driver: bridge
  monitoring:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
