; Cấu hình PHP bổ sung cho website đặt vé (nạp sau php.ini-production)

; Không lộ phiên bản PHP qua header X-Powered-By, không in lỗi ra trình duyệt
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

date.timezone = Asia/Ho_Chi_Minh
memory_limit = 128M
post_max_size = 2M
upload_max_filesize = 1M
max_execution_time = 30

; Session: lưu trong /tmp (tmpfs), cookie HttpOnly + SameSite, chặn session id lạ
session.save_path = /tmp
session.name = CINEMASESSID
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200

; Tắt các tính năng nguy hiểm không dùng tới
allow_url_fopen = Off
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec

; Mã nguồn nằm cố định trong image nên không cần kiểm tra thay đổi file
opcache.enable = 1
opcache.validate_timestamps = 0
