<VirtualHost *:8080>
    ServerName cinema-app
    DocumentRoot /var/www/app/public

    <Directory /var/www/app/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        # Mọi đường dẫn không phải file tĩnh đều chuyển cho front controller index.php
        FallbackResource /index.php
    </Directory>

    # Không ghi log cho healthcheck của Docker (15 giây/lần) để log gọn hơn
    SetEnvIf Request_URI "^/health$" dontlog
    # %{X-Real-IP}i: IP thật của khách do Nginx chuyển tiếp
    LogFormat "%{X-Real-IP}i %h %t \"%r\" %>s %b %Dus \"%{User-Agent}i\"" cinema
    CustomLog ${APACHE_LOG_DIR}/access.log cinema env=!dontlog
    ErrorLog ${APACHE_LOG_DIR}/error.log
</VirtualHost>
