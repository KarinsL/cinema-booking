# =====================================================================
# Nginx reverse proxy (image nginxinc/nginx-unprivileged: chạy bằng user nginx uid 101)
# Container nghe 8080 (HTTP) và 8443 (HTTPS); docker-compose map ra cổng 80/443 của máy.
# =====================================================================
worker_processes auto;
pid /tmp/nginx.pid;                 # user thường chỉ ghi được vào /tmp
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Thư mục tạm đặt trong /tmp để chạy được với user không phải root và root filesystem chỉ đọc
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # ---- Ẩn phiên bản, giới hạn kích thước và thời gian chờ (giảm tấn công slowloris) ----
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # ---- Log truy cập dạng JSON ra stdout: Promtail gửi lên Loki, truy vấn bằng LogQL ----
    log_format json_access escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time","referer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_access;

    # ---- Giới hạn tốc độ: trang đăng nhập 10 request/phút/IP, toàn site 20 request/giây/IP ----
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=20r/s;
    limit_req_status 429;

    # ---- TLS dùng chung cho mọi server HTTPS (chứng chỉ tự ký có SAN cho các tên miền) ----
    ssl_certificate     /etc/nginx/certs/cinema.local.crt;
    ssl_certificate_key /etc/nginx/certs/cinema.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # WebSocket (Grafana Live)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # DNS nội bộ của Docker: phân giải tên service (app, phpmyadmin, grafana...) lúc có request,
    # nên Nginx vẫn khởi động được khi một service phía sau chưa chạy
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
}
