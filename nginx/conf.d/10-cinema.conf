# =====================================================================
# Website đặt vé: https://cinema.local  ->  container app:8080 (PHP + Apache)
# =====================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name cinema.local www.cinema.local;

    include /etc/nginx/snippets/security-headers.conf;
    # CSP: chỉ cho tải script/style/ảnh từ chính website (app không dùng CDN ngoài)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;

    # Biến + resolver: Nginx hỏi DNS của Docker mỗi lần cần, không lỗi khi app khởi động lại đổi IP
    set $app_upstream http://app:8080;

    # Không công khai metrics nghiệp vụ (Prometheus đọc trực tiếp app:8080 trong mạng nội bộ)
    location = /metrics { return 404; }
    location = /health  { return 404; }

    # Chặn truy cập file ẩn (.env, .git ...)
    location ~ /\.(?!well-known) { deny all; }

    # Chống dò mật khẩu: tối đa 10 request/phút/IP vào trang đăng nhập
    location = /login {
        limit_req zone=login_limit burst=5 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $app_upstream;
    }

    location /assets/ {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $app_upstream;
        expires 7d;
    }

    location / {
        limit_req zone=general_limit burst=40 nodelay;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $app_upstream;
    }
}
