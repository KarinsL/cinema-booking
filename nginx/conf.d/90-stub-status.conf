# =====================================================================
# Trang trạng thái nội bộ cho nginx-prometheus-exporter (cổng 8081, KHÔNG publish ra máy host)
# =====================================================================
server {
    listen 8081;
    server_name _;
    access_log off;

    # Chỉ cho các container trong mạng Docker (dải IP private) và chính nó đọc
    allow 127.0.0.1;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    deny all;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}
