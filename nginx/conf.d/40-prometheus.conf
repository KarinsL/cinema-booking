# =====================================================================
# Prometheus: https://prometheus.cinema.local  ->  container prometheus:9090
# Prometheus không có đăng nhập nên bắt buộc Basic Auth ở Nginx
# =====================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name prometheus.cinema.local;

    include /etc/nginx/snippets/security-headers.conf;

    auth_basic "Cinema Admin Tools";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    set $prometheus_upstream http://prometheus:9090;

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Authorization "";
        proxy_pass $prometheus_upstream;
    }
}
