# =====================================================================
# phpMyAdmin: https://pma.cinema.local  ->  container phpmyadmin:80
# Hai lớp bảo vệ: HTTP Basic Auth của Nginx + đăng nhập MySQL của phpMyAdmin
# =====================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name pma.cinema.local;

    include /etc/nginx/snippets/security-headers.conf;

    auth_basic "Cinema Admin Tools";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    client_max_body_size 20m;   # cho phép import file .sql vừa phải
    set $pma_upstream http://phpmyadmin:80;

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Authorization "";   # không chuyển mật khẩu Basic Auth xuống phpMyAdmin
        proxy_pass $pma_upstream;
    }
}
