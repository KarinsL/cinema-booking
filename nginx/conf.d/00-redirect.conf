# Mọi truy cập HTTP (cổng 80 của máy, 8080 trong container) chuyển sang HTTPS
server {
    listen 8080 default_server;
    server_name _;

    # Dùng cho healthcheck của Docker
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Truy cập HTTPS bằng tên miền lạ hoặc bằng IP: chuyển về website chính
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/snippets/security-headers.conf;

    location / {
        return 301 https://cinema.local$request_uri;
    }
}
