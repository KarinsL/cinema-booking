# =====================================================================
# Grafana: https://grafana.cinema.local  ->  container grafana:3000
# (Grafana tự có màn hình đăng nhập, mật khẩu admin lấy từ file .env)
# =====================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name grafana.cinema.local;

    include /etc/nginx/snippets/security-headers.conf;
    set $grafana_upstream http://grafana:3000;

    location / {
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_pass $grafana_upstream;
    }

    # Grafana Live dùng WebSocket
    location /api/live/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass $grafana_upstream;
    }
}
