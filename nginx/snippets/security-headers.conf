# Header bảo mật dùng cho mọi server HTTPS.
# Lưu ý của Nginx: nếu một location có add_header riêng thì không kế thừa các dòng này,
# nên các location trong conf.d không dùng add_header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # buộc dùng HTTPS
add_header X-Frame-Options "SAMEORIGIN" always;                                      # chống clickjacking
add_header X-Content-Type-Options "nosniff" always;                                  # chặn đoán kiểu MIME
add_header Referrer-Policy "strict-origin-when-cross-origin" always;                 # hạn chế lộ URL
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-XSS-Protection "0" always;   # OWASP khuyến nghị tắt bộ lọc XSS cũ, dùng CSP thay thế
