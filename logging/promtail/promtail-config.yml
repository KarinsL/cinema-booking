# =====================================================================
# Promtail: tự phát hiện container qua Docker API, đọc stdout/stderr
# và gửi lên Loki kèm nhãn container, service, stream, project
# =====================================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /var/lib/promtail/positions.yaml   # nhớ vị trí đã đọc, khởi động lại không gửi trùng

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        # Chỉ lấy log của các container thuộc project "cinema" (khai báo name: cinema trong docker-compose)
        filters:
          - name: label
            values: ["com.docker.compose.project=cinema"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'          # vd: cinema-nginx
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'            # vd: nginx, app, db
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'             # stdout | stderr
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'
    pipeline_stages:
      # Log JSON của Nginx: lấy mã trạng thái HTTP làm nhãn để lọc nhanh {service="nginx", status="404"}
      - match:
          selector: '{service="nginx"}'
          stages:
            - json:
                expressions:
                  status: status
            - labels:
                status:
      # Log nghiệp vụ JSON của website: gắn nhãn level (info/warning/error)
      - match:
          selector: '{service="app"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
